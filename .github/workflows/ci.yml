name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config -q
      - name: Start stack (waits for healthchecks)
        run: docker compose up -d --build --wait
      - name: Smoke test API against real Postgres
        run: ./scripts/smoke.sh http://localhost:5000
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
